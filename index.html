<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060a">
<title>MR-1010 • MAX REALMS - 3 • CINEMATIC FOREST & PROGRESSION FIX</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --gold: #f4c56a;
    --gold2: #ad6c19;
    --gold-glow: rgba(244, 197, 106, 0.35);
    --bg-dark: #03060a;
  }
  
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    color: #f7f2e8;
    font-family: Inter, Segoe UI, Arial, sans-serif;
  }
  
  button { font: inherit; cursor: pointer; border: 0; }
  
  /* TOP BAR CINEMÁTICA */
  .top {
    height: 58px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 3vw;
    background: #061019cf;
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #ffffff08;
    position: relative;
    z-index: 100;
  }
  .brand { font-weight: 950; letter-spacing: .15em; text-transform: uppercase; }
  .brand b { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
  .brand small { font-size: 8px; color: #8296a6; margin-left: 7px; letter-spacing: .05em; }
  .meta { margin-left: auto; display: flex; gap: 14px; font-size: 13px; }
  .circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #10202d80;
    color: #fff;
    border: 1px solid #ffffff12;
    font-weight: 900;
    transition: all 0.3s ease;
  }
  .circle:hover { background: #10202dff; border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); }

  /* AMBIENTE DA TELA */
  .screen {
    display: none;
    height: calc(100vh - 58px);
    position: relative;
    overflow: hidden;
    perspective: 1400px;
  }
  .screen.active { display: block; }
  
  /* CANVAS & PLANOS DE PARALAXE */
  .host { position: absolute; inset: -5%; width: 110%; height: 110%; transform-style: preserve-3d; will-change: transform; }
  .host canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
  
  /* PROCESSAMENTO ÓPTICO E PÓS-PRODUÇÃO (UI) */
  .shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    /* Mistura de Vinheta natural com tom atmosférico escuro da floresta */
    background: 
      radial-gradient(circle at 50% 50%, transparent 20%, rgba(3, 6, 10, 0.5) 60%, rgba(2, 4, 8, 0.95) 100%),
      linear-gradient(to top, rgba(2, 6, 13, 1) 0%, rgba(2, 6, 13, 0) 40%);
  }

  /* Camada Dinâmica de Granulado de Filme */
  .film-grain {
    position: absolute;
    inset: 0;
    z-index: 6;
    opacity: 0.035;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* REVESTIMENTO DO MENU (3D MATRICIAL) */
  .menu {
    position: absolute;
    z-index: 10;
    left: 6vw;
    top: 12vh;
    max-width: 760px;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1);
  }
  
  .eyebrow {
    font-size: 11px;
    letter-spacing: .35em;
    color: var(--gold);
    font-weight: 950;
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--gold-glow);
  }
  
  .menu h1 {
    font-size: clamp(48px, 7.5vw, 106px);
    line-height: .85;
    margin: 20px 0 26px;
    letter-spacing: -.04em;
    text-transform: uppercase;
    color: #fff;
    /* Bloom e Sombra projetada massiva */
    text-shadow: 
      0 20px 50px rgba(0,0,0,0.9),
      0 0 30px rgba(255,255,255,0.08);
    transform: translateZ(50px);
  }
  .menu h1 em {
    font-style: normal;
    color: var(--gold);
    text-shadow: 0 0 25px rgba(244, 197, 106, 0.5);
  }
  
  .menu p {
    max-width: 580px;
    color: #b2bdc6;
    line-height: 1.65;
    font-size: 15px;
    text-shadow: 0 5px 15px rgba(0,0,0,0.5);
    transform: translateZ(25px);
    margin-bottom: 40px;
  }
  
  /* CONTAINER DE AÇÕES DO MENU JOGO AAA */
  .action-container {
    display: flex;
    gap: 16px;
    transform-style: preserve-3d;
    transform: translateZ(35px);
  }
  
  .btn {
    padding: 16px 36px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 4px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  
  .primary {
    background: linear-gradient(135deg, var(--gold) 0%, #dca33a 100%);
    color: #03060a;
    box-shadow: 0 10px 30px rgba(244, 197, 106, 0.2);
  }
  .primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(244, 197, 106, 0.4);
    filter: brightness(1.1);
  }
  
  .secondary {
    background: rgba(255, 255, 255, 0.03);
    color: #f7f2e8;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
  }
  .secondary:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
  }
  
  .btn:active {
    transform: translateY(1px);
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">MR-1010 • <b>MAX REALMS</b><small>v3.0 - FIX</small></div>
  <div class="meta">
    <button class="circle">?</button>
  </div>
</div>

<!-- Adicionada classe .active para testes visuais -->
<div class="screen active" id="gameScreen">
  <!-- O Canvas e Fundo ganham a movimentação controlada do Paralaxe -->
  <div class="host" id="sceneHost">
    <canvas id="gameCanvas"></canvas>
  </div>
  
  <!-- Camadas cinemáticas protetoras de lentes ópticas -->
  <div class="shade"></div>
  <div class="film-grain"></div>
  
  <!-- O Menu reage em um eixo 3D complementar ao mouse -->
  <div class="menu" id="interactiveMenu">
    <div class="eyebrow">Progression Fix & Expansion</div>
    <h1>Cinematic<br><em>Forest</em></h1>
    <p>Explore uma reconstrução florestal fotorrealista com física de progressão reajustada. Iluminação volumétrica avançada e renderização de ecossistema em tempo real.</p>
    
    <div class="action-container">
      <button class="btn primary">Iniciar Jornada</button>
      <button class="btn secondary">Configurações</button>
    </div>
  </div>
</div>

<script>
  // Inicialização simulada para o canvas de fundo funcionar visualmente
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth * 1.1; // Margem para não cortar no paralaxe
    canvas.height = window.innerHeight * 1.1;
    
    // Desenha um fundo temporário degradê profundo simulando a mata escura
    let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 10, canvas.width/2, canvas.height/2, canvas.width);
    gradient.addColorStop(0, '#0d2219'); // Verde esmeralda escuro/floresta profundo
    gradient.addColorStop(0.5, '#061114');
    gradient.addColorStop(1, '#020508');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  // SISTEMA DE PARALAXE ULTRA SUAVE (INTERACTION MOUSE LERP)
  const sceneHost = document.getElementById('sceneHost');
  const interactiveMenu = document.getElementById('interactiveMenu');

  let mouseX = 0, mouseY = 0;
  let currentX = 0, currentY = 0;
  const ease = 0.06; // Controla a suavidade da transição física (quanto menor, mais cinematográfico e pesado)

  window.addEventListener('mousemove', (e) => {
    // Normaliza a posição do mouse entre -0.5 e 0.5
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
  });

  function animateParallax() {
    // Interpolação linear mecânica (Lerp) para fluidez de movimento
    currentX += (mouseX - currentX) * ease;
    currentY += (mouseY - currentY) * ease;

    // 1. Move o fundo levemente na direção oposta ou paralela para dar profundidade de lente
    sceneHost.style.transform = `translateX(${currentX * -35}px) translateY(${currentY * -35}px) scale(1.05)`;

    // 2. Inclina e move o menu de forma tridimensional e ortogonal
    const rotateX = currentY * -15; // Rotação vertical baseada no movimento vertical
    const rotateY = currentX * 15;  // Rotação lateral baseada no movimento horizontal
    
    interactiveMenu.style.transform = `
      translateX(${currentX * 20}px) 
      translateY(${currentY * 20}px) 
      rotateX(${rotateX}deg) 
      rotateY(${rotateY}deg)
    `;

    requestAnimationFrame(animateParallax);
  }
  
  // Dispara o loop cinemático
  animateParallax();
</script>

</body>
</html>
